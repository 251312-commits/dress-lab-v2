<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Dress Lab V2 - 분리된 신체 파츠를 원본 좌표 그대로 결합한 미리보기">
  <title>Dress Lab V2</title>
  <link rel="preload" as="image" href="./assets/care/facial/towel-wet.png">
  <link rel="stylesheet" href="./ui/layout.css?v=wardrobe-tabs-v2-20261126">
  <link rel="stylesheet" href="./ui/care-room.css?v=customer-facial-cycle-v1">
  <link rel="stylesheet" href="./ui/facial-care.css?v=facial-wet-towel-20261126">
  <link rel="stylesheet" href="./ui/color-wheel.css?v=skin-hsb-wheel-20261122">
  <link rel="stylesheet" href="./ui/wardrobe-panel.css?v=wardrobe-tabs-v2-20261126">
  <link rel="stylesheet" href="./ui/outfit-review.css?v=temporary-review-v1">
  <link rel="stylesheet" href="./ui/dye-workbench.css?v=auto-dye-v2-20261126">
  <script src="./ui/layout.js?v=wardrobe-tabs-v2-20261126" defer></script>
  <script src="./ui/care-room.js?v=customer-facial-cycle-v1" defer></script>
  <script src="./ui/color-wheel.js?v=exact-skin-rgb-20261122" defer></script>
  <script src="./ui/wardrobe-panel.js?v=wardrobe-tabs-v2-20261126" defer></script>
  <script src="./ui/outfit-review.js?v=temporary-review-v1" defer></script>
  <script src="./ui/dye-workbench.js?v=auto-dye-v2-20261126" defer></script>
  <script src="./ui/magic-room.js?v=leg-continuous-v11-20261122" defer></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
    }

    /* Entire image canvas is the game screen, with no header or frame. */
    .stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh; /* fallback */
      height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #fff;
    }
    /*
     * The artboard is the original PNG coordinate plane, uniformly scaled
     * to fit the viewport. Nothing is cropped or geometrically distorted.
     * Future UI elements can be positioned in this same coordinate plane.
     */
    .artboard {
      position: relative;
      width: 100%;
      height: 100%;
      flex: none;
    }
    #character {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none; /* drag the character without browser scrolling */
    }
    .ui-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .stage[aria-busy="true"] .artboard { visibility: hidden; }

    /* Visible only while loading or when an error occurred. */
    .loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #786f69;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    .stage[aria-busy="false"] .loading { display: none; }
    .stage.error .loading { display: grid; }

    /* Keep progress announcements accessible without displaying UI chrome. */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="기본 캐릭터 이미지" aria-busy="true">
    <div class="artboard" id="artboard">
      <canvas id="character" role="img" aria-label="분리된 신체 파츠를 합친 기본 캐릭터">Canvas를 지원하지 않는 브라우저야.</canvas>
      <div class="ui-overlay" id="ui-overlay"></div>
    </div>
    <div class="loading" id="loading">파츠 이미지를 불러오는 중...</div>
    <p class="sr-only" id="status" role="status" aria-live="polite"></p>
  </main>

  <script src="./rig/skin-tone.js?v=live-skin-png-20261122"></script>
  <script src="./rig/rig.js?v=facial-care-layer-v1"></script>
  <script src="./rig/eyes.js?v=eyes-visible-glints-lateral-boing-20261124"></script>
  <script src="./clothes/wardrobe.js?v=temporary-review-v1-20261126"></script>
  <script src="./rig/body-shape.js?v=anchored-arms-continuous-hands-v12-20261124"></script>
  <script src="./rig/body-shape-debug.js?v=leg-continuous-v11-20261122"></script>
  <script src="./rig/motion.js?v=motions-20261122b"></script>
  <script src="./rig/debug.js?v=jointcaps-v8-20261122"></script>
  <script src="./ui/facial-care.js?v=customer-facial-cycle-v1"></script>
  <script>
    "use strict";

    // GitHub Pages 자체에는 폴더 목록 조회 기능이 없다.
    // 공개 GitHub API에서 base/의 파일명을 가져오고, 접근 실패 시 아래 목록을 사용한다.
    const BASE_API = "https://api.github.com/repos/251312-commits/dress-lab-v2/contents/base?ref=main";
    const FALLBACK_LAYERS = [
      "01-Head.PNG",
      "02-Neck.PNG",
      "03-Bust.PNG",
      "04-UpperArm(L).PNG",
      "05-UpperArm(R).PNG",
      "06-UpperTorso.PNG",
      "07-LowerTorso.PNG",
      "08-TorsoJoint.PNG",
      "09-Hips.PNG",
      "10-UpperLeg(L).PNG",
      "11-UpperLeg(R).PNG",
      "12-LowerLeg(L).PNG",
      "13-LowerLeg(R).PNG",
      "14-LowerArm(L).PNG",
      "15-LowerArm(R).PNG",
      "16-hand(L).PNG",
      "17-Hand(R).PNG"
    ];

    const canvas = document.getElementById("character");
    const stage = document.getElementById("stage");
    const artboard = document.getElementById("artboard");
    const loading = document.getElementById("loading");
    const status = document.getElementById("status");

    function isPartFile(name) {
      return typeof name === "string" &&
        /^\d+[-_. ].+\.png$/i.test(name) &&
        !/^full\.png$/i.test(name);
    }

    function layerNumber(name) {
      return Number(name.match(/^\d+/)[0]);
    }

    // 큰 번호를 먼저 그려야 작은 번호가 최상단에 놓인다.
    function backToFront(a, b) {
      return layerNumber(b) - layerNumber(a) || a.localeCompare(b);
    }

    async function getPartFilenames() {
      try {
        const response = await fetch(BASE_API, {
          headers: { "Accept": "application/vnd.github+json" }
        });
        if (!response.ok) throw new Error("GitHub API HTTP " + response.status);
        const entries = await response.json();
        if (!Array.isArray(entries)) throw new Error("폴더 응답 형식이 올바르지 않음");
        const filenames = entries
          .filter(item => item.type === "file" && isPartFile(item.name))
          .map(item => item.name);
        if (filenames.length) return filenames.sort(backToFront);
      } catch (error) {
        console.info("GitHub 폴더 조회 실패. 기본 파츠 목록으로 전환:", error);
      }
      return FALLBACK_LAYERS.filter(isPartFile).sort(backToFront);
    }

    function loadImage(filename) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.decoding = "async";
        image.onload = () => resolve({ filename, image });
        image.onerror = () => reject(new Error(filename + " 이미지 로드 실패"));
        image.src = "./base/" + encodeURIComponent(filename);
      });
    }

    // Fit the ENTIRE source image into the screen, leaving no crop.
    // When the screen has the same aspect ratio, the artboard fills it exactly.
    function fitArtboard() {
      if (!canvas.dataset.ready) return;
      const viewportWidth = stage.clientWidth;
      const viewportHeight = stage.clientHeight;
      if (!viewportWidth || !viewportHeight) return;
      const scale = Math.min(viewportWidth / canvas.width, viewportHeight / canvas.height);
      artboard.style.width = (canvas.width * scale) + "px";
      artboard.style.height = (canvas.height * scale) + "px";
    }

    window.addEventListener("resize", fitArtboard);
    if ("ResizeObserver" in window) {
      new ResizeObserver(fitArtboard).observe(stage);
    }

    async function renderCharacter() {
      try {
        const filenames = await getPartFilenames();
        loading.textContent = filenames.length + "개 파츠 이미지를 불러오는 중...";
        const results = await Promise.allSettled(filenames.map(loadImage));
        const loaded = results
          .filter(result => result.status === "fulfilled")
          .map(result => result.value);
        const failures = results
          .filter(result => result.status === "rejected")
          .map(result => result.reason.message);

        if (!loaded.length) throw new Error("파츠 이미지를 불러올 수 없어. base/ 폴더와 파일명을 확인해 줘.");

        // 파츠들은 동일한 크기의 투명 캔버스를 공유한다.
        // 원본 픽셀 좌표 (0, 0)에 그대로 그리며 크기·위치를 바꾸지 않는다.
        const reference = loaded.find(item => layerNumber(item.filename) === 1) || loaded[0];
        const { naturalWidth: width, naturalHeight: height } = reference.image;
        const context = canvas.getContext("2d");
        if (!context) throw new Error("이 브라우저는 2D Canvas를 지원하지 않아.");

        canvas.width = width;
        canvas.height = height;
        context.clearRect(0, 0, width, height);

        // Only use source-dimension-matching images. Keep the original numeric
        // layer order, so an all-zero joint pose is pixel-identical to V2.
        const usableLayers = [];
        for (const item of loaded.sort((a, b) => backToFront(a.filename, b.filename))) {
          if (item.image.naturalWidth !== width || item.image.naturalHeight !== height) {
            failures.push(item.filename + ": 이미지 크기 불일치");
            continue;
          }
          usableLayers.push(item);
        }
        const drawn = usableLayers.length;
        let rig = null;
        let motion = null;
        let bodyShape = null;
        try {
          const response = await fetch("./rig/rig.json", { cache: "no-cache" });
          if (!response.ok) throw new Error("rig.json HTTP " + response.status);
          const definition = await response.json();
          if (!window.DressLabRig) throw new Error("rig.js를 불러올 수 없어");
          rig = new window.DressLabRig({
            canvas,
            layers: usableLayers,
            config: definition
          });
          window.dressLabRig = rig;
          // Compare with no temporary joint caps using ?caps=0.
          if (new URLSearchParams(window.location.search).get("caps") === "0") {
            rig.showJointCaps(false);
          }

          // Original full-canvas PNGs contain large transparent margins.
          // Crop just their drawing surfaces for inexpensive repeated frames.
          rig.prepareFastSprites();

          // Apply color only at render time. Body-shape sources remain untinted.
          if (window.DressLabSkinTone) {
            try {
              const skinTone = new window.DressLabSkinTone(rig);
              window.dressLabSkinTone = skinTone;
              skinTone.setColor(window.DressLabSkinColorWheel?.getColor()?.hex || "#FAEDED");
            } catch (skinError) {
              console.warn("피부톤 렌더링 초기화 실패:", skinError);
            }
          }

          // Prepare the original four leg sprites once. Shape changes only
          // resample these leg images and never modify the source PNGs.
          if (window.DressLabBodyShape) {
            try {
              bodyShape = new window.DressLabBodyShape(rig);
              window.dressLabBodyShape = bodyShape;
              window.DressLabMagicRoom?.bindShape(bodyShape);
            } catch (shapeError) {
              console.warn("국소 체형 변형 초기화 실패:", shapeError);
            }
          }

          // Load independent shirt and trousers with their own joint attachments.
          // Failed outfit assets must never prevent the base doll from loading.
          if (window.DressLabWardrobe) {
            try {
              const wardrobe = new window.DressLabWardrobe(rig);
              window.dressLabWardrobe = wardrobe;
              await wardrobe.load();
            } catch (outfitError) {
              console.warn("의상 에셋 로드 실패 · 기본 인형은 계속 사용:", outfitError);
              window.dispatchEvent(new CustomEvent("dresslab:wardrobe-error", {
                detail: { message: outfitError.message }
              }));
            }
          }

          // Eyes remain independent PNG layers and follow the Head rig,
          // including head/neck changes created by the body-shape controller.
          if (window.DressLabEyes) {
            try {
              const eyes = new window.DressLabEyes(rig, canvas);
              eyes.bodyShape = bodyShape;
              await eyes.load();
              window.dressLabEyes = eyes;
            } catch (eyeError) {
              console.warn("눈 애니메이션 초기화 실패 · 몸체 렌더링은 계속:", eyeError);
            }
          }

          if (window.DressLabMotion) {
            const idleAllowed = new URLSearchParams(window.location.search).get("idle") !== "0";
            motion = new window.DressLabMotion(rig, { autoStart: idleAllowed });
            window.dressLabMotion = motion;
            if (window.dressLabEyes) window.dressLabEyes.motion = motion;
          }
          // Care is an independent overlay in the head's original coordinates.
          // Its progress never changes source art, skin color, body or clothing.
          window.DressLabFacialCare?.bind(rig, bodyShape);
        } catch (rigError) {
          // Keep the original static doll functional if rig data is unavailable.
          console.warn("관절 리그 불러오기 실패 · 기존 합성 방식으로 표시:", rigError);
          context.setTransform(1, 0, 0, 1, 0, 0);
          context.clearRect(0, 0, width, height);
          for (const item of usableLayers) context.drawImage(item.image, 0, 0);
        }

        status.textContent = drawn + "개 파츠 결합 · 원본 " + width + " × " + height + "px" +
          (failures.length ? " · " + failures.length + "개 파츠를 확인해 줘." : "");
        if (failures.length) console.warn("파츠 확인 필요:", failures);
        canvas.dataset.ready = "true";
        fitArtboard();
        // Leave the default game screen unchanged. The motion-only mode opens
        // a compact, always-visible five-button dock; ?rig=1 shows full controls.
        const params = new URLSearchParams(window.location.search);
        const preview = params.get("rig") === "1" ||
                        params.get("motions") === "1" ||
                        Boolean(params.get("motion"));
        if (bodyShape && (params.get("body") === "1" || params.get("shape") === "1") &&
            window.DressLabRooms?.current !== "magic") {
          window.DressLabBodyShapeDebug?.mount(bodyShape, motion);
        }
        if (rig && preview) {
          window.DressLabRigDebug?.mount(rig, motion);
          const chosenMotion = params.get("motion");
          if (motion && chosenMotion && window.DressLabMotionActions?.includes(chosenMotion)) {
            motion.play(chosenMotion);
          }
        }
      } catch (error) {
        console.error(error);
        stage.classList.add("error");
        loading.textContent = error.message;
        status.textContent = "이미지 표시 오류";
      } finally {
        stage.setAttribute("aria-busy", "false");
      }
    }

    // Color-wheel input is independent from the character's 30 fps motion loop.
    // The skin renderer coalesces rapid drag events into one repaint per frame.
    window.addEventListener("dresslab:skin-color-change", event => {
      window.dressLabSkinTone?.queueColor(event.detail?.hex);
    });

    renderCharacter();
  </script>
</body>
</html>

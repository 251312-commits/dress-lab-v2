<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ee">
  <meta name="description" content="Dress Lab V2 - 분리된 신체 파츠를 원본 좌표 그대로 결합한 미리보기">
  <title>Dress Lab V2</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      background: #f6f3ee;
      color: #37332f;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { min-height: 100svh; }
    .app {
      width: 100%;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
    }
    .heading {
      width: min(100%, 960px);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    h1 {
      margin: 0;
      font-size: clamp(18px, 4vw, 24px);
      font-weight: 700;
      letter-spacing: -0.035em;
    }
    .tag {
      color: #8b827a;
      font-size: 12px;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }
    .stage {
      position: relative;
      width: min(100%, 960px);
      flex: 1;
      min-height: 320px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid #e8e0d7;
      border-radius: 20px;
      background: #fffcf8;
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 65% 70% at 50% 43%, #ffffff 0%, transparent 100%);
    }
    canvas {
      position: relative;
      display: block;
      width: auto;
      height: auto;
      max-width: calc(100% - 20px);
      max-height: min(78svh, 900px);
      object-fit: contain;
    }
    .stage[aria-busy="true"] canvas { visibility: hidden; }
    .loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #92877c;
      font-size: 13px;
      text-align: center;
      padding: 24px;
    }
    .stage[aria-busy="false"] .loading { display: none; }
    .status {
      width: min(100%, 960px);
      margin: 0;
      font-size: 12px;
      color: #897f76;
      text-align: center;
      line-height: 1.5;
    }
    @media (max-width: 600px) {
      .app { gap: 12px; padding-right: 10px; padding-left: 10px; }
      .stage { border-radius: 14px; }
      canvas { max-width: calc(100% - 8px); max-height: min(81svh, 900px); }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="heading">
      <h1>Dress Lab V2</h1>
      <span class="tag">BASE CHARACTER · PREVIEW</span>
    </header>
    <section class="stage" id="stage" aria-label="기본 캐릭터 이미지" aria-busy="true">
      <canvas id="character" role="img" aria-label="분리된 신체 파츠를 합친 기본 캐릭터">
        이 브라우저는 Canvas를 지원하지 않는다.
      </canvas>
      <div class="loading" id="loading">파츠 이미지를 불러오는 중...</div>
    </section>
    <p class="status" id="status" role="status" aria-live="polite">이미지를 준비하고 있어.</p>
  </main>

  <script>
    "use strict";

    // GitHub Pages 자체에는 폴더 목록 조회 기능이 없다.
    // 공개 GitHub API에서 base/의 파일명을 가져오고, 접근 실패 시 아래 목록을 사용한다.
    const BASE_API = "https://api.github.com/repos/251312-commits/dress-lab-v2/contents/base?ref=main";
    const FALLBACK_LAYERS = [
      "01-Head.PNG",
      "02-Neck.PNG",
      "03-Bust.PNG",
      "04-UpperTorso.PNG",
      "05-LowerTorso.PNG",
      "06-TorsoJoint.PNG",
      "07-Hips.PNG",
      "08-UpperLeg(L).PNG",
      "09-UpperLeg(R).PNG",
      "10-LowerLeg(L).PNG",
      "11-LowerLeg(R).PNG",
      "12-UpperArm(L).PNG",
      "13-UpperArm(R).PNG",
      "14-LowerArm(L).PNG",
      "15-LowerArm(R).PNG",
      "16-hand(L).PNG",
      "17-Hand(R).PNG"
    ];

    const canvas = document.getElementById("character");
    const stage = document.getElementById("stage");
    const loading = document.getElementById("loading");
    const status = document.getElementById("status");

    function isPartFile(name) {
      return typeof name === "string" &&
        /^\d+[-_. ].+\.png$/i.test(name) &&
        !/^full\.png$/i.test(name);
    }

    function layerNumber(name) {
      return Number(name.match(/^\d+/)[0]);
    }

    // 큰 번호를 먼저 그려야 작은 번호가 최상단에 놓인다.
    function backToFront(a, b) {
      return layerNumber(b) - layerNumber(a) || a.localeCompare(b);
    }

    async function getPartFilenames() {
      try {
        const response = await fetch(BASE_API, {
          headers: { "Accept": "application/vnd.github+json" }
        });
        if (!response.ok) throw new Error("GitHub API HTTP " + response.status);
        const entries = await response.json();
        if (!Array.isArray(entries)) throw new Error("폴더 응답 형식이 올바르지 않음");
        const filenames = entries
          .filter(item => item.type === "file" && isPartFile(item.name))
          .map(item => item.name);
        if (filenames.length) return filenames.sort(backToFront);
      } catch (error) {
        console.info("GitHub 폴더 조회 실패. 기본 파츠 목록으로 전환:", error);
      }
      return FALLBACK_LAYERS.filter(isPartFile).sort(backToFront);
    }

    function loadImage(filename) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.decoding = "async";
        image.onload = () => resolve({ filename, image });
        image.onerror = () => reject(new Error(filename + " 이미지 로드 실패"));
        image.src = "./base/" + encodeURIComponent(filename);
      });
    }

    async function renderCharacter() {
      try {
        const filenames = await getPartFilenames();
        loading.textContent = filenames.length + "개 파츠 이미지를 불러오는 중...";
        const results = await Promise.allSettled(filenames.map(loadImage));
        const loaded = results
          .filter(result => result.status === "fulfilled")
          .map(result => result.value);
        const failures = results
          .filter(result => result.status === "rejected")
          .map(result => result.reason.message);

        if (!loaded.length) throw new Error("파츠 이미지를 불러올 수 없어. base/ 폴더와 파일명을 확인해 줘.");

        // 파츠들은 동일한 크기의 투명 캔버스를 공유한다.
        // 원본 픽셀 좌표 (0, 0)에 그대로 그리며 크기·위치를 바꾸지 않는다.
        const reference = loaded.find(item => layerNumber(item.filename) === 1) || loaded[0];
        const { naturalWidth: width, naturalHeight: height } = reference.image;
        const context = canvas.getContext("2d");
        if (!context) throw new Error("이 브라우저는 2D Canvas를 지원하지 않아.");

        canvas.width = width;
        canvas.height = height;
        context.clearRect(0, 0, width, height);

        let drawn = 0;
        for (const item of loaded.sort((a, b) => backToFront(a.filename, b.filename))) {
          if (item.image.naturalWidth !== width || item.image.naturalHeight !== height) {
            failures.push(item.filename + ": 이미지 크기 불일치");
            continue;
          }
          context.drawImage(item.image, 0, 0);
          drawn += 1;
        }

        status.textContent = drawn + "개 파츠 결합 · 원본 " + width + " × " + height + "px" +
          (failures.length ? " · " + failures.length + "개 파츠를 확인해 줘." : "");
        if (failures.length) console.warn("파츠 확인 필요:", failures);
      } catch (error) {
        console.error(error);
        stage.classList.add("error");
        loading.textContent = error.message;
        status.textContent = "이미지 표시 오류";
      } finally {
        stage.setAttribute("aria-busy", "false");
      }
    }

    renderCharacter();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Dress Lab V2 - 분리된 신체 파츠를 원본 좌표 그대로 결합한 미리보기">
  <title>Dress Lab V2</title>
  <link rel="stylesheet" href="./ui/layout.css">
  <script src="./ui/layout.js" defer></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
    }

    /* Entire image canvas is the game screen, with no header or frame. */
    .stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh; /* fallback */
      height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #fff;
    }
    /*
     * The artboard is the original PNG coordinate plane, uniformly scaled
     * to fit the viewport. Nothing is cropped or geometrically distorted.
     * Future UI elements can be positioned in this same coordinate plane.
     */
    .artboard {
      position: relative;
      width: 100%;
      height: 100%;
      flex: none;
    }
    #character {
      display: block;
      width: 100%;
      height: 100%;
    }
    .ui-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .stage[aria-busy="true"] .artboard { visibility: hidden; }

    /* Visible only while loading or when an error occurred. */
    .loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #786f69;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    .stage[aria-busy="false"] .loading { display: none; }
    .stage.error .loading { display: grid; }

    /* Keep progress announcements accessible without displaying UI chrome. */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="기본 캐릭터 이미지" aria-busy="true">
    <div class="artboard" id="artboard">
      <canvas id="character" role="img" aria-label="분리된 신체 파츠를 합친 기본 캐릭터">Canvas를 지원하지 않는 브라우저야.</canvas>
      <div class="ui-overlay" id="ui-overlay"></div>
    </div>
    <div class="loading" id="loading">파츠 이미지를 불러오는 중...</div>
    <p class="sr-only" id="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    "use strict";

    // GitHub Pages 자체에는 폴더 목록 조회 기능이 없다.
    // 공개 GitHub API에서 base/의 파일명을 가져오고, 접근 실패 시 아래 목록을 사용한다.
    const BASE_API = "https://api.github.com/repos/251312-commits/dress-lab-v2/contents/base?ref=main";
    const FALLBACK_LAYERS = [
      "01-Head.PNG",
      "02-Neck.PNG",
      "03-Bust.PNG",
      "04-UpperTorso.PNG",
      "05-LowerTorso.PNG",
      "06-TorsoJoint.PNG",
      "07-Hips.PNG",
      "08-UpperLeg(L).PNG",
      "09-UpperLeg(R).PNG",
      "10-LowerLeg(L).PNG",
      "11-LowerLeg(R).PNG",
      "12-UpperArm(L).PNG",
      "13-UpperArm(R).PNG",
      "14-LowerArm(L).PNG",
      "15-LowerArm(R).PNG",
      "16-hand(L).PNG",
      "17-Hand(R).PNG"
    ];

    const canvas = document.getElementById("character");
    const stage = document.getElementById("stage");
    const artboard = document.getElementById("artboard");
    const loading = document.getElementById("loading");
    const status = document.getElementById("status");

    function isPartFile(name) {
      return typeof name === "string" &&
        /^\d+[-_. ].+\.png$/i.test(name) &&
        !/^full\.png$/i.test(name);
    }

    function layerNumber(name) {
      return Number(name.match(/^\d+/)[0]);
    }

    // 큰 번호를 먼저 그려야 작은 번호가 최상단에 놓인다.
    function backToFront(a, b) {
      return layerNumber(b) - layerNumber(a) || a.localeCompare(b);
    }

    async function getPartFilenames() {
      try {
        const response = await fetch(BASE_API, {
          headers: { "Accept": "application/vnd.github+json" }
        });
        if (!response.ok) throw new Error("GitHub API HTTP " + response.status);
        const entries = await response.json();
        if (!Array.isArray(entries)) throw new Error("폴더 응답 형식이 올바르지 않음");
        const filenames = entries
          .filter(item => item.type === "file" && isPartFile(item.name))
          .map(item => item.name);
        if (filenames.length) return filenames.sort(backToFront);
      } catch (error) {
        console.info("GitHub 폴더 조회 실패. 기본 파츠 목록으로 전환:", error);
      }
      return FALLBACK_LAYERS.filter(isPartFile).sort(backToFront);
    }

    function loadImage(filename) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.decoding = "async";
        image.onload = () => resolve({ filename, image });
        image.onerror = () => reject(new Error(filename + " 이미지 로드 실패"));
        image.src = "./base/" + encodeURIComponent(filename);
      });
    }

    // Fit the ENTIRE source image into the screen, leaving no crop.
    // When the screen has the same aspect ratio, the artboard fills it exactly.
    function fitArtboard() {
      if (!canvas.dataset.ready) return;
      const viewportWidth = stage.clientWidth;
      const viewportHeight = stage.clientHeight;
      if (!viewportWidth || !viewportHeight) return;
      const scale = Math.min(viewportWidth / canvas.width, viewportHeight / canvas.height);
      artboard.style.width = (canvas.width * scale) + "px";
      artboard.style.height = (canvas.height * scale) + "px";
    }

    window.addEventListener("resize", fitArtboard);
    if ("ResizeObserver" in window) {
      new ResizeObserver(fitArtboard).observe(stage);
    }

    async function renderCharacter() {
      try {
        const filenames = await getPartFilenames();
        loading.textContent = filenames.length + "개 파츠 이미지를 불러오는 중...";
        const results = await Promise.allSettled(filenames.map(loadImage));
        const loaded = results
          .filter(result => result.status === "fulfilled")
          .map(result => result.value);
        const failures = results
          .filter(result => result.status === "rejected")
          .map(result => result.reason.message);

        if (!loaded.length) throw new Error("파츠 이미지를 불러올 수 없어. base/ 폴더와 파일명을 확인해 줘.");

        // 파츠들은 동일한 크기의 투명 캔버스를 공유한다.
        // 원본 픽셀 좌표 (0, 0)에 그대로 그리며 크기·위치를 바꾸지 않는다.
        const reference = loaded.find(item => layerNumber(item.filename) === 1) || loaded[0];
        const { naturalWidth: width, naturalHeight: height } = reference.image;
        const context = canvas.getContext("2d");
        if (!context) throw new Error("이 브라우저는 2D Canvas를 지원하지 않아.");

        canvas.width = width;
        canvas.height = height;
        context.clearRect(0, 0, width, height);

        let drawn = 0;
        for (const item of loaded.sort((a, b) => backToFront(a.filename, b.filename))) {
          if (item.image.naturalWidth !== width || item.image.naturalHeight !== height) {
            failures.push(item.filename + ": 이미지 크기 불일치");
            continue;
          }
          context.drawImage(item.image, 0, 0);
          drawn += 1;
        }

        status.textContent = drawn + "개 파츠 결합 · 원본 " + width + " × " + height + "px" +
          (failures.length ? " · " + failures.length + "개 파츠를 확인해 줘." : "");
        if (failures.length) console.warn("파츠 확인 필요:", failures);
        canvas.dataset.ready = "true";
        fitArtboard();
      } catch (error) {
        console.error(error);
        stage.classList.add("error");
        loading.textContent = error.message;
        status.textContent = "이미지 표시 오류";
      } finally {
        stage.setAttribute("aria-busy", "false");
      }
    }

    renderCharacter();
  </script>
</body>
</html>

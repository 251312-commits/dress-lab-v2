<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1240" viewBox="0 0 1600 1240" font-family="Noto Sans CJK KR"><defs><clipPath id="upperClip"><path d="M243 978 C226 976 211 989 205 1012 C201 1049 194 1089 179 1138 C172 1158 162 1180 157 1188 Q180 1217 212 1206 C218 1174 225 1142 240 1098 C250 1060 275 1033 277 1018 C283 999 267 978 243 978 Z" fill="white"/></clipPath><clipPath id="lowerClip"><path d="M170 1144 Q200 1124 224 1162 C217 1191 199 1228 186 1268 L165 1330 Q139 1329 114 1312 L135 1263 C149 1222 163 1180 170 1144 Z" fill="white"/></clipPath></defs><rect x="0" y="0" width="1600" height="1240" rx="0" fill="#F6F7FA"/><text x="52" y="76" font-size="43" fill="#292B32" font-weight="700">긴 소매는 팔꿈치에서 두 파트로</text><text x="52" y="125" font-size="25" fill="#666B75" font-weight="400">화면 왼쪽 = L / 오른쪽 = R · 어깨 연결부만 고정하고 나머지 소매는 체형에 맞춘다.</text><rect x="52" y="165" width="730" height="920" rx="20" fill="white"/><rect x="810" y="165" width="738" height="920" rx="20" fill="white"/><text x="88" y="218" font-size="26" fill="#292B32" font-weight="700">화면 왼쪽 소매 · 확대도</text><clipPath id="armCardClip"><rect x="52" y="234" width="730" height="790"/></clipPath><g clip-path="url(#armCardClip)"><g transform="translate(50 255) scale(1.93) translate(-40 -950)"><path d="M170 1144 Q200 1124 224 1162 C217 1191 199 1228 186 1268 L165 1330 Q139 1329 114 1312 L135 1263 C149 1222 163 1180 170 1144 Z" fill="#22C55E"/><path d="M170 1144 C163 1180 149 1222 135 1263 L114 1312 Q139 1329 165 1330 L186 1268 C199 1228 217 1191 224 1162" fill="none" stroke="#3E5F4C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><g clip-path="url(#upperClip)"><polygon points="361.852,947.767 191.568,889.429 159.158,984.031 329.442,1042.369" fill="#3B82F6"/><polygon points="329.442,1042.369 159.158,984.031 135.823,1052.145 306.107,1110.483" fill="#FACC15"/><polygon points="306.107,1110.483 135.823,1052.145 71.651,1239.457 241.935,1297.795" fill="#22C55E"/></g><path d="M243 978 C226 976 211 989 205 1012 C201 1049 194 1089 179 1138 C172 1158 162 1180 157 1188 M212 1206 C218 1174 225 1142 240 1098" fill="none" stroke="#475467" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="230.42499883352238" y1="1189.46041626704" x2="147.17500116647764" y2="1160.93958373296" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="4 3"/><g opacity="0.55"><line x1="237.25738500569148" y1="1166.4317710790497" x2="155.89943274017045" y2="1138.5591392843803" stroke="#667085" stroke-width="1" stroke-dasharray="3 3"/><line x1="221.70056725982957" y1="1211.8408607156196" x2="140.34261499430855" y2="1183.9682289209502" stroke="#667085" stroke-width="1" stroke-dasharray="3 3"/></g><line x1="236.3" y1="1013.2" x2="252.3" y2="1013.2" stroke="#EF4444" stroke-width="4"/><line x1="244.3" y1="1005.2" x2="244.3" y2="1021.2" stroke="#EF4444" stroke-width="4"/><line x1="180.8" y1="1175.2" x2="196.8" y2="1175.2" stroke="#EF4444" stroke-width="4"/><line x1="188.8" y1="1167.2" x2="188.8" y2="1183.2" stroke="#EF4444" stroke-width="4"/><line x1="133.1" y1="1319.3" x2="149.1" y2="1319.3" stroke="#EF4444" stroke-width="4"/><line x1="141.1" y1="1311.3" x2="141.1" y2="1327.3" stroke="#EF4444" stroke-width="4"/><path d="M118 1301 Q142 1317 169 1320" fill="none" stroke="#33754B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="572" y="324" font-size="26" fill="#292B32" font-weight="700">A  윗소매</text><text x="572" y="366" font-size="22" fill="#3B82F6" font-weight="400">어깨 부착부</text><text x="572" y="406" font-size="22" fill="#856700" font-weight="400">전환 구간</text><text x="572" y="446" font-size="22" fill="#187A40" font-weight="400">체형 대응</text><text x="572" y="680" font-size="26" fill="#292B32" font-weight="700">팔꿈치</text><text x="572" y="717" font-size="21" fill="#666B75" font-weight="400">겹침 기준선</text><text x="572" y="815" font-size="26" fill="#292B32" font-weight="700">B  아랫소매</text><text x="572" y="853" font-size="22" fill="#187A40" font-weight="400">체형 대응</text><text x="88" y="1047" font-size="19" fill="#666B75" font-weight="400">점선·십자·글자는 가이드이며 의상 그림에 넣지 않는다.</text><text x="852" y="223" font-size="29" fill="#292B32" font-weight="700">어깨에서 연결을 유지</text><text x="852" y="270" font-size="23" fill="#292B32" font-weight="400">파란 띠: 어깨 부착부의 크기·모양 유지</text><text x="852" y="312" font-size="23" fill="#292B32" font-weight="400">노란 구간: 고정과 변형을 부드럽게 연결</text><text x="852" y="354" font-size="23" fill="#292B32" font-weight="400">초록 부분: 팔의 폭과 길이 변화에 대응</text><text x="852" y="408" font-size="23" fill="#205BC0" font-weight="700">소매 전체를 파란색으로 칠하지 않는다.</text><line x1="852" y1="444" x2="1506" y2="444" stroke="#D9DDE4" stroke-width="2"/><text x="852" y="492" font-size="29" fill="#292B32" font-weight="700">팔꿈치에서 충분히 겹침</text><text x="852" y="539" font-size="23" fill="#292B32" font-weight="400">각 파트가 관절선을 24px 지나가게 시작</text><text x="852" y="581" font-size="23" fill="#292B32" font-weight="400">합쳐서 약 48px 겹침 · 팔 축 방향으로 측정</text><text x="852" y="623" font-size="23" fill="#292B32" font-weight="400">숨는 끝은 둥글게, 자르는 경계에는 선 없음</text><text x="852" y="672" font-size="25" fill="#9A5D12" font-weight="700">시작 여유 24px · 동작에서 확인</text><line x1="852" y1="710" x2="1506" y2="710" stroke="#D9DDE4" stroke-width="2"/><text x="852" y="758" font-size="29" fill="#292B32" font-weight="700">저장할 파트</text><text x="852" y="802" font-size="22" fill="#292B32" font-weight="400">sleeve_upper_L.png  /  sleeve_upper_R.png</text><text x="852" y="844" font-size="22" fill="#292B32" font-weight="400">sleeve_lower_L.png  /  sleeve_lower_R.png</text><text x="852" y="891" font-size="23" fill="#292B32" font-weight="400">몸통은 별도 torso.png</text><text x="852" y="940" font-size="23" fill="#187A40" font-weight="700">긴 소매의 손목 소맷단: 초록 구역</text><text x="852" y="979" font-size="22" fill="#666B75" font-weight="400">폭은 팔에 맞추고 높이는 유지하는 설정</text><text x="852" y="1016" font-size="20" fill="#666B75" font-weight="400">반팔의 소맷단은 윗팔에 붙인다.</text><text x="852" y="1060" font-size="22" fill="#292B32" font-weight="700">모든 그림·zones PNG는 1206 × 2622 px</text><rect x="52" y="1120" width="28" height="28" rx="4" fill="#22C55E"/><text x="92" y="1144" font-size="24" fill="#292B32" font-weight="700">체형 대응</text><text x="52" y="1183" font-size="21" fill="#666B75" font-weight="400">#22C55E</text><text x="156" y="1183" font-size="18" fill="#666B75" font-weight="400">폭·길이 등 지정 축</text><rect x="440" y="1120" width="28" height="28" rx="4" fill="#3B82F6"/><text x="480" y="1144" font-size="24" fill="#292B32" font-weight="700">로컬 크기 유지</text><text x="440" y="1183" font-size="21" fill="#666B75" font-weight="400">#3B82F6</text><text x="544" y="1183" font-size="18" fill="#666B75" font-weight="400">이동·회전은 함께</text><rect x="828" y="1120" width="28" height="28" rx="4" fill="#FACC15"/><text x="868" y="1144" font-size="24" fill="#292B32" font-weight="700">점진 전환</text><text x="828" y="1183" font-size="21" fill="#666B75" font-weight="400">#FACC15</text><text x="932" y="1183" font-size="18" fill="#666B75" font-weight="400">50%를 뜻하지 않음</text><rect x="1216" y="1120" width="28" height="28" rx="4" fill="#EF4444"/><text x="1256" y="1144" font-size="24" fill="#292B32" font-weight="700">부착 표식</text><text x="1216" y="1183" font-size="21" fill="#666B75" font-weight="400">#EF4444</text><text x="1320" y="1183" font-size="18" fill="#666B75" font-weight="400">별도 가이드 PNG</text></svg>
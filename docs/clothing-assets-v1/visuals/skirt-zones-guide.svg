1022" font-size="22" fill="#292B32" font-weight="400">위: 초록 / 중간: 노랑 / 밑단: 파랑</text><text x="570" y="1057" font-size="22" fill="#666B75" font-weight="400">본체는 한 파일로 유지</text><text x="1100" y="979" font-size="25" fill="#292B32" font-weight="700">밑단도 함께 움직인다</text><text x="1100" y="1022" font-size="23" fill="#292B32" font-weight="400">허리를 따라 이동·회전</text><text x="1100" y="1057" font-size="20" fill="#666B75" font-weight="400">화면 확대·축소도 동일하게 적용</text><rect x="52" y="1120" width="28" height="28" rx="4" fill="#22C55E"/><text x="92" y="1144" font-size="24" fill="#292B32" font-weight="700">체형 대응</text><text x="52" y="1183" font-size="21" fill="#666B75" font-weight="400">#22C55E</text><text x="156" y="1183" font-size="18" fill="#666B75" font-weight="400">폭·길이 등 지정 축</text><rect x="440" y="1120" width="28" height="28" rx="4" fill="#3B82F6"/><text x="480" y="1144" font-size="24" fill="#292B32" font-weight="700">로컬 크기 유지</text><text x="440" y="1183" font-size="21" fill="#666B75" font-weight="400">#3B82F6</text><text x="544" y="1183" font-size="18" fill="#666B75" font-weight="400">이동·회전은 함께</text><rect x="828" y="1120" width="28" height="28" rx="4" fill="#FACC15"/><text x="868" y="1144" font-size="24" fill="#292B32" font-weight="700">점진 전환</text><text x="828" y="1183" font-size="21" fill="#666B75" font-weight="400">#FACC15</text><text x="932" y="1183" font-size="18" fill="#666B75" font-weight="400">50%를 뜻하지 않음</text><rect x="1216" y="1120" width="28" height="28" rx="4" fill="#EF4444"/><text x="1256" y="1144" font-size="24" fill="#292B32" font-weight="700">부착 표식</text><text x="1216" y="1183" font-size="21" fill="#666B75" font-weight="400">#EF4444</text><text x="1320" y="1183" font-size="18" fill="#666B75" font-weight="400">별도 가이드 PNG</text></svg>
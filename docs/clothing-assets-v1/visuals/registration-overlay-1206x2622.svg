<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1206" height="2622" viewBox="0 0 1206 2622" font-family="Noto Sans CJK KR"><text x="56" y="82" font-size="40" fill="#34333D" font-weight="700">의상 PNG 원본 좌표 가이드</text><text x="56" y="130" font-size="25" fill="#34333D" font-weight="400">1206 × 2622 px · 원점은 좌상단 · 모든 파트의 캔버스는 동일</text><text x="56" y="174" font-size="24" fill="#686674" font-weight="400">가이드 레이어를 숨긴 뒤 투명 PNG로 내보낸다.</text><rect x="2" y="2" width="1202" height="2618" fill="none" stroke="#CAC7D1" stroke-width="4"/><line x1="328.6" y1="360" x2="328.6" y2="2170" stroke="#A8A3B2" stroke-width="2" stroke-dasharray="10 9"/><text x="328.6" y="325" font-size="24" fill="#686674" font-weight="400" text-anchor="middle">몸통 중심 x = 328.6</text><text x="62" y="2490" font-size="30" fill="#34333D" font-weight="700">크롭 금지</text><text x="62" y="2538" font-size="25" fill="#34333D" font-weight="400">캐릭터를 캔버스 가운데로 옮기지 않는다.</text><text x="62" y="2580" font-size="24" fill="#686674" font-weight="400">출력 파일에는 베이스·번호·가이드 선을 포함하지 않는다.</text><text x="698" y="661" font-size="29" fill="#34333D" font-weight="700">L/R은 보는 사람 기준</text><text x="698" y="707" font-size="22" fill="#686674" font-weight="400">화면 왼쪽 = L · 화면 오른쪽 = R</text><line x1="231.3" y1="1013.2" x2="257.3" y2="1013.2" stroke="#EF4444" stroke-width="4"/><line x1="244.3" y1="1000.2" x2="244.3" y2="1026.2" stroke="#EF4444" stroke-width="4"/><text x="264.3" y="1000.2" font-size="21" fill="#EF4444" font-weight="700">1</text><text x="698" y="790" font-size="27" fill="#34333D" font-weight="700">1. 어깨 L</text><text x="698" y="827" font-size="22" fill="#686674" font-weight="400">shoulderL  (244.3, 1013.2)</text><line x1="175.8" y1="1175.2" x2="201.8" y2="1175.2" stroke="#EF4444" stroke-width="4"/><line x1="188.8" y1="1162.2" x2="188.8" y2="1188.2" stroke="#EF4444" stroke-width="4"/><text x="208.8" y="1162.2" font-size="21" fill="#EF4444" font-weight="700">2</text><text x="698" y="906" font-size=
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1240" viewBox="0 0 1600 1240" font-family="Noto Sans CJK KR"><defs><clipPath id="upperClip"><path d="M243 978 C226 976 211 989 205 1012 C201 1049 194 1089 179 1138 C172 1158 162 1180 157 1188 Q180 1217 212 1206 C218 1174 225 1142 240 1098 C250 1060 275 1033 277 1018 C283 999 267 978 243 978 Z" fill="white"/></clipPath><clipPath id="lowerClip"><path d="M170 1144 Q200 1124 224 1162 C217 1191 199 1228 186 1268 L165 1330 Q139 1329 114 1312 L135 1263 C149 1222 163 1180 170 1144 Z" fill="white"/></clipPath><pattern id="check" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#FAFBFC"/><path d="M0 0H12V12H0ZM12 12H24V24H12Z" fill="#E9ECF1"/></pattern></defs><rect x="0" y="0" width="1600" height="1240" rx="0" fill="#F6F7FA"/><text x="52" y="76" font-size="43" fill="#292B32" font-weight="700">그림 · 색구역 · 부착 표식은 별도 PNG</text><text x="52" y="125" font-size="25" fill="#666B75" font-weight="400">아래는 확대 미리보기다. 실제 파일은 모두 1206 × 2622 px의 같은 위치·같은 캔버스를 사용한다.</text><rect x="52" y="165" width="480" height="706" rx="20" fill="white"/><text x="76" y="218" font-size="28" fill="#292B32" font-weight="700">1  의상 그림</text><rect x="76" y="248" width="432" height="520" rx="10" fill="url(#check)"/><g transform="translate(140 275) scale(1.9) translate(-140 -950)"><path d="M243 978 C226 976 211 989 205 1012 C201 1049 194 1089 179 1138 C172 1158 162 1180 157 1188 Q180 1217 212 1206 C218 1174 225 1142 240 1098 C250 1060 275 1033 277 1018 C283 999 267 978 243 978 Z" fill="#FAFAFC"/><path d="M243 978 C226 976 211 989 205 1012 C201 1049 194 1089 179 1138 C172 1158 162 1180 157 1188 M212 1206 C218 1174 225 1142 240 1098" fill="none" stroke="#817D8B" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M217 1016 C214 1040 209 1058 205 1072" fill="none" stroke="#DFDBE5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="292" y="811" font-size="21" fill="#292B32" font-weight="700" text-anchor="middle">sleeve_upper_L.png</text><text x="292" y="848" font-size="20" fill="#666B75" font-weight="400" text-anchor="middle">색·질감·외곽선이 있는 실제 옷</text><rect x="560" y="165" width="480" height="706" rx="20" fill="white"/><text x="584" y="218" font-size="28" fill="#292B32" font-weight="700">2  변형 색구역</text><rect x="584" y="248" width="432" height="520" rx="10" fill="url(#check)"/><g transform="translate(648 275) scale(1.9) translate(-140 -950)"><g clip-path="url(#upperClip)"><polygon points="361.852,947.767 191.568,889.429 159.158,984.031 329.442,1042.369" fill="#3B82F6"/><polygon points="329.442,1042.369 159.158,984.031 135.823,1052.145 306.107,1110.483" fill="#FACC15"/><polygon points="306.107,1110.483 135.823,1052.145 71.651,1239.457 241.935,1297.795" fill="#22C55E"/></g></g><text x="800" y="811" font-size="21" fill="#292B32" font-weight="700" text-anchor="middle">zones/sleeve_upper_L.zones.png</text><text x="800" y="848" font-size="20" fill="#666B75" font-weight="400" text-anchor="middle">초록·파랑·노랑의 구역 정보</text><rect x="1068" y="165" width="480" height="706" rx="20" fill="white"/><text x="1092" y="218" font-size="28" fill="#292B32" font-weight="700">3  부착 가이드</text><rect x="1092" y="248" width="432" height="520" rx="10" fill="url(#check)"/><g transform="translate(1156 275) scale(1.9) translate(-140 -950)"><g opacity="0.65"><path d="M243 978 C226 976 211 989 205 1012 C201 1049 194 1089 179 1138 C172 1158 162 1180 157 1188 Q180 1217 212 1206 C218 1174 225 1142 240 1098 C250 1060 275 1033 277 1018 C283 999 267 978 243 978 Z" fill="#DDE1E8"/><path d="M243 978 C226 976 211 989 205 1012 C201 1049 194 1089 179 1138 C172 1158 162 1180 157 1188 M212 1206 C218 1174 225 1142 240 1098" fill="none" stroke="#A4ABB7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><line x1="235.3" y1="1013.2" x2="253.3" y2="1013.2" stroke="#EF4444" stroke-width="4"/><line x1="244.3" y1="1004.2" x2="244.3" y2="1022.2" stroke="#EF4444" stroke-width="4"/><line x1="179.8" y1="1175.2" x2="197.8" y2="1175.2" stroke="#EF4444" stroke-width="4"/><line x1="188.8" y1="1166.2" x2="188.8" y2="1184.2" stroke="#EF4444" stroke-width="4"/></g><text x="1308" y="811" font-size="21" fill="#292B32" font-weight="700" text-anchor="middle">attachment-guide.png</text><text x="1308" y="848" font-size="20" fill="#666B75" font-weight="400" text-anchor="middle">전체 착용 모습에 빨간 연결 표식</text><rect x="52" y="906" width="1496" height="179" rx="20" fill="white"/><text x="84" y="952" font-size="29" fill="#292B32" font-weight="700">파랑 = 화면에 고정된다는 뜻이 아니다.</text><text x="84" y="997" font-size="24" fill="#292B32" font-weight="400">해당 구역의 로컬 크기·모양을 보존한다. 캐릭터를 따라 이동·회전하고 화면 확대·축소도 따른다.</text><text x="84" y="1048" font-size="24" fill="#292B32" font-weight="400">노랑은 고정 50%가 아니라 두 구역을 부드럽게 잇는 전환 구간이다. 빨강은 zones에 넣지 않는다.</text><rect x="52" y="1120" width="28" height="28" rx="4" fill="#22C55E"/><text x="92" y="1144" font-size="24" fill="#292B32" font-weight="700">체형 대응</text><text x="52" y="1183" font-size="21" fill="#666B75" font-weight="400">#22C55E</text><text x="156" y="1183" font-size="18" fill="#666B75" font-weight="400">폭·길이 등 지정 축</text><rect x="440" y="1120" width="28" height="28" rx="4" fill="#3B82F6"/><text x="480" y="1144" font-size="24" fill="#292B32" font-weight="700">로컬 크기 유지</text><text x="440" y="1183" font-size="21" fill="#666B75" font-weight="400">#3B82F6</text><text x="544" y="1183" font-size="18" fill="#666B75" font-weight="400">이동·회전은 함께</text><rect x="828" y="1120" width="28" height="28" rx="4" fill="#FACC15"/><text x="868" y="1144" font-size="24" fill="#292B32" font-weight="700">점진 전환</text><text x="828" y="1183" font-size="21" fill="#666B75" font-weight="400">#FACC15</text><text x="932" y="1183" font-size="18" fill="#666B75" font-weight="400">50%를 뜻하지 않음</text><rect x="1216" y="1120" width="28" height="28" rx="4" fill="#EF4444"/><text x="1256" y="1144" font-size="24" fill="#292B32" font-weight="700">부착 표식</text><text x="1216" y="1183" font-size="21" fill="#666B75" font-weight="400">#EF4444</text><text x="1320" y="1183" font-size="18" fill="#666B75" font-weight="400">별도 가이드 PNG</text></svg>